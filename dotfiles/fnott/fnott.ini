[main]
# Hide the application name (removes the italic "notify-send" or "niri")
title-format=

# Fonts (we can remove title-font since we hid the title!)
summary-font=JetBrains Mono:size=10
body-font=JetBrains Mono:size=10

# Lock the width so it looks longer. 
# Setting max-width also tells fnott to auto-wrap long text downwards!
min-width=300
max-width=300

# Colors
background=060606b3
border-color=141414ee
summary-color=e5e5e5ff
body-color=e5e5e5ff

# Borders and Layout
border-size=3
border-radius=0
padding-vertical=15
padding-horizontal=15
edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=10

# Timeout (in seconds)
max-timeout=5
