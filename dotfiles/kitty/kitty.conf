# === General Settings ===
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2
confirm_os_window_close 0
hide_window_decorations yes
cursor_shape beam
shell fish

# === Fonts ===
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# === Window ===
window_padding_width 15
background_opacity   0.7

# === Graphite Theme (Modified) ===
# The basic colors
foreground                      #ffffff
background                      #000000
selection_foreground            #000000
selection_background            #ffffff

# Cursor colors
cursor                          #ffffff
cursor_text_color               #000000

# URL underline color when hovering with mouse
url_color                       #d4d4d4

# kitty window border colors and terminal bell colors
active_border_color             #000000
inactive_border_color           #000000
bell_border_color               #ffffff
visual_bell_color               none

# OS Window titlebar colors
wayland_titlebar_color          system
macos_titlebar_color            system

# Tab bar colors
active_tab_foreground           #ffffff
active_tab_background           #000000
inactive_tab_foreground         #b9b9b9
inactive_tab_background         #000000
tab_bar_background              none
tab_bar_margin_color            none

# Colors for marks (marked text in the terminal)
mark1_foreground #000000
mark1_background #ffffff
mark2_foreground #000000
mark2_background #d4d4d4
mark3_foreground #000000
mark3_background #b9b9b9

# === The 16 Terminal Colors ===

# black
color0 #262626
color8 #262626

# red
color1 #646464
color9 #646464

# green (Adjusted for Fish)
color2  #98c379
color10 #98c379

# yellow (Adjusted for Fish)
color3  #e5c07b
color11 #e5c07b

# blue
color4  #989898
color12 #989898

# magenta/purple (Adjusted for Fish)
color5  #c678dd
color13 #c678dd

# cyan
color6  #585858
color14 #585858

# white
color7  #d4d4d4
color15 #d4d4d4
